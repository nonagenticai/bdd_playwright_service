[project]
license = "Apache-2.0"
name = "bdd-playwright-service"
version = "0.1.0"
description = "BDD Playwright script generation microservice with Gherkin-based narration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "psycopg[binary,pool]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "python-dotenv>=1.2.0",
    "redis>=7.3.0",
    "alembic>=1.18.0",
    "httpx>=0.28.0",
    "cachetools>=7.0.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    # >=0.39.0 for the storage facade's streaming put_file + range-aware
    # get_object_stream (used to store/serve the package zip without buffering
    # it in memory).
    # >=0.75.0 for ``w2v_common.auth.LICENSE_GATE`` — the shared entitlement
    # dependency mounted on the tenant-scoped ``/api/bdd`` router. This is a
    # HARD floor, not a nicety: on an older w2v_common the import fails at
    # startup, which is the honest failure. A soft floor would instead let a
    # BILLED service deploy with the gate silently absent.
    # >=0.106.0 for ``w2v_common.clients.WebscraperClient`` — web_url inspection
    # calls webscraper directly now that KAG is retired.
    "w2v-common>=0.106.0",
    # MinIO shared artifact storage so generated BDD packages survive across
    # replicas (the download route lands on any pod). The w2v_common storage
    # facade imports miniopy-async lazily, so the consumer declares it.
    "miniopy-async>=1.23.0",
    # --- Security floors on transitive dependencies ---
    # Neither of these is imported by this service directly; both arrive through
    # other pins — aiohttp via `miniopy-async` (directly, and again through its
    # own `aiohttp-retry` pin), and cryptography via `w2v-common` -> `pyjwt`. The
    # lock is already at safe versions; these floors are what stop it drifting
    # back. A lock is a point-in-time resolution, so the next unrelated
    # `uv lock` is free to walk an undeclared transitive down again. The declared
    # floor is the only thing that binds it.
    #
    # aiohttp 3.14.1 was flagged by CVE-2026-59881 + CVE-2026-69243 (fixed in
    # 3.14.2) and CVE-2026-69244 (fixed in 3.14.3); 3.14.3 was then flagged by
    # CVE-2026-111063 + CVE-2026-111064 + GHSA-2g87-pp6c-29x5 (fixed in 3.14.4).
    "aiohttp>=3.14.4",
    # cryptography: CVE-2026-69247 (GHSA-g6cj-pr64-35w5) was introduced in
    # 44.0.0 and fixed in 50.0.0, so the previously-locked 49.0.0 was affected.
    "cryptography>=50.0.0",
    "playwright>=1.55",
]

[project.scripts]
bdd-playwright-service = "src.asgi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",

    "pytest-asyncio>=1.3.0",

    "pytest-cov>=7.0.0",

    "pytest-timeout>=2.4.0",

    "httpx>=0.28.0",
    "ruff>=0.15.0",

    "ty>=0.0.23",

    "pip-audit>=2.10.0",
    # pip is a transitive dep of pip-audit (pip-audit -> pip-api -> pip).
    # Explicit floor: pip < 26.2 is vulnerable to PYSEC-2026-3721.
    "pip>=26.2",

    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",

    "fakeredis>=2.34.0",
    # Lua interpreter for fakeredis. The rate limiter's admission decision is a
    # single Redis EVAL; without lupa, fakeredis cannot execute it and every
    # concurrency/window test would have to fake the verdict — i.e. assert the
    # mock, not the script.
    "lupa>=2.8",
]

[tool.uv]
override-dependencies = [
    # miniopy-async (1.23.5, the LATEST release, so there is no upstream fix to
    # wait for) caps the CA-certificate bundle:
    #   certifi>=2025.1.31,<2026.0.0
    # That is lazy upper-bounding, not a real incompatibility -- certifi ships
    # DATA, its entire public API is where()/contents(), and shipping CURRENT
    # roots is the package's whole purpose. Left alone the cap pins this repo to a
    # trust store from Nov 2025, and no relock can move it.
    #
    # NOT overriding miniopy-async's argon2-cffi<24.0.0 alongside it: that is a
    # MAJOR bump with real API surface and needs its own testing rather than
    # riding along with a data-only package.
    "certifi>=2026.7.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "BLE", "A", "S", "C901",
    "RUF", "RET", "SIM", "ASYNC", "PTH", "TID251",
]
ignore = [
    "E501",
    "B008",
    "ASYNC240",
    "ASYNC109"
]

# uuid7 is the id standard (stdlib, py3.14). TID251 bans `uuid4` in production
# code via ruff — enforced in CI (`ruff check .`), not only local pre-commit.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"uuid.uuid4".msg = "uuid7 is the w2v id standard — use uuid.uuid7() (stdlib, py3.14)."

[tool.ruff.lint.per-file-ignores]
"src/database/migrations/*" = ["I001", "ANN"]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S107", "S108", "ANN", "PTH", "ASYNC230", "ASYNC240", "SIM117", "TID251"]

# ── ANN401 ratchet (see [tool.ruff.lint].ignore note) ─────────────────────────
# These files still carry `Any` in a function signature. Do NOT add to this list.
# When you type a file's seam with pydantic models, DELETE its line here — that
# re-enables ANN401 for the file and locks the win in. Target: empty.
"src/auth/middleware.py" = ["ANN401"]
"src/services/job_processor.py" = ["ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# LOUD, not silent: this expression DESELECTS `integration` everywhere, and CI
# re-selects it NOWHERE (.github/workflows/ci-cd.yaml passes no test-select
# input). Anything wearing `integration` therefore runs on NO machine at all.
# `tests/test_no_unrun_marker_tests.py` fails the build if any test wears it
# without a written, printed waiver naming what CI genuinely lacks.
addopts = "-m 'not integration'"
markers = [
    "unit: unit tests",
    # ⛔ NEVER SELECTED ANYWHERE. Reserved for a test that needs a LIVE PEER
    # SERVICE or real outbound network — not merely Postgres or Redis, both of
    # which the archetype provisions per job (has_postgres / has_redis).
    # Currently worn only by tests/integration/test_contracts.py, which sends
    # real HTTP to three live peer services. It is NOT unrun: the same
    # assertions live in tests/integration/contract_checks.py and are executed
    # against the live cluster by .github/workflows/contract-lane.yaml, as an
    # in-cluster Job in the w2v namespace. The gate enforces BOTH a written
    # waiver and the existence of that lane.
    "integration: DESELECTED by addopts and re-selected nowhere in CI — a test wearing this executes on no machine; requires a waiver in tests/test_no_unrun_marker_tests.py",
]
filterwarnings = [
    "ignore:coroutine '.*AsyncMockMixin._execute_mock_call.*' was never awaited:RuntimeWarning",
]

[tool.coverage.report]
fail_under = 80

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
import-not-found = "error"
unresolved-reference = "error"
missing-attribute = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
missing-argument = "error"
invalid-argument-type = "error"
invalid-explicit-return = "error"

[tool.bandit]
targets = ["src"]
skips = ["B311"]
exclude_dirs = ["tests", ".venv"]

[tool.uv.sources]
# The published source tree resolves its shared library from the public
# repository at the release tag; the private index is not reachable here.
w2v-common = { git = "https://github.com/nonagenticai/w2v_common", tag = "v0.115.4" }
